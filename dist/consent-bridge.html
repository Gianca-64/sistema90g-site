<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Consenso Analytics Sistema 90G</title>
</head>
<body>
<script>
(() => {
  'use strict';
  const PORTAL_ORIGIN = 'https://portale.sistema90g.it';
  const CONSENT_KEY = 's90g_cookie_consent';
  function sendConsent() {
    if (!window.parent || window.parent === window) return;
    window.parent.postMessage({
      type: 's90g:analytics-consent',
      consent: window.localStorage.getItem(CONSENT_KEY) || 'unknown'
    }, PORTAL_ORIGIN);
  }
  window.addEventListener('message', (event) => {
    if (event.origin !== PORTAL_ORIGIN) return;
    if (event.data?.type === 's90g:analytics-consent-request') sendConsent();
  });
  sendConsent();
})();
</script>
</body>
</html>
