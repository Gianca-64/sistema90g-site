<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Frigorifero vicino alla parete con apertura insufficiente</title>
  <desc id="desc">Schema di una cucina con frigorifero troppo vicino alla parete laterale: la porta si apre ma non permette uso comodo dei cassetti interni.</desc>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b82018"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#111" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#f6f3ed"/>
  <rect x="60" y="52" width="1080" height="650" rx="20" fill="#fff" stroke="#d9d6d0" filter="url(#shadow)"/>

  <text x="92" y="112" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#111">La porta si apre. Ma non abbastanza.</text>
  <text x="92" y="150" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#575757">Il problema non è solo aprire il frigo: è usarlo bene ogni giorno.</text>

  <rect x="160" y="230" width="760" height="350" fill="#f6f3ed" stroke="#c8c1b6" stroke-width="4"/>
  <rect x="880" y="230" width="42" height="350" fill="#111" opacity="0.85"/>
  <text x="846" y="612" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#575757">parete</text>

  <rect x="660" y="280" width="180" height="250" fill="#ebe5db" stroke="#111" stroke-width="4"/>
  <line x1="750" y1="280" x2="750" y2="530" stroke="#111" stroke-width="3"/>
  <rect x="690" y="312" width="38" height="12" fill="#111"/>
  <rect x="775" y="312" width="38" height="12" fill="#111"/>
  <text x="670" y="260" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#111">frigorifero</text>

  <path d="M 660 282 C 535 305 498 405 555 510" fill="none" stroke="#b82018" stroke-width="7" stroke-dasharray="13 10"/>
  <text x="348" y="330" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="900" fill="#b82018">apertura reale limitata</text>
  <path d="M 540 340 C 575 335 610 318 655 295" fill="none" stroke="#b82018" stroke-width="4" marker-end="url(#arrow-red)"/>

  <rect x="682" y="420" width="130" height="54" fill="#fff" stroke="#b82018" stroke-width="4"/>
  <text x="280" y="462" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900" fill="#111">cassetto interno difficile da estrarre</text>
  <path d="M 580 458 L 680 448" fill="none" stroke="#b82018" stroke-width="4" marker-end="url(#arrow-red)"/>

  <rect x="160" y="230" width="230" height="350" fill="#ebe5db" stroke="#c8c1b6" stroke-width="3"/>
  <text x="210" y="612" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#575757">colonne / basi</text>

  <rect x="92" y="620" width="600" height="46" rx="8" fill="#111" opacity="0.94"/>
  <text x="116" y="650" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#fff">Il controllo misura l'uso reale, non solo la composizione chiusa.</text>
</svg>