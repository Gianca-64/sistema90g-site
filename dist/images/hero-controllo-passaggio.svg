<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Controllo passaggio cucina con lavastoviglie aperta</title>
  <desc id="desc">Schema di una cucina con lavastoviglie aperta che riduce il passaggio verso una porta finestra.</desc>
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#b82018" stroke-width="3" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#111" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#f6f3ed"/>
  <rect x="50" y="48" width="1100" height="664" rx="20" fill="#ffffff" stroke="#d9d6d0" filter="url(#shadow)"/>

  <text x="84" y="110" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#111">Nel render sembra tutto libero.</text>
  <text x="84" y="148" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#575757">Poi apri la lavastoviglie e il passaggio cambia.</text>

  <rect x="120" y="220" width="360" height="390" fill="#ebe5db" stroke="#c8c1b6" stroke-width="3"/>
  <rect x="720" y="220" width="360" height="390" fill="#ebe5db" stroke="#c8c1b6" stroke-width="3"/>
  <text x="220" y="650" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#575757">basi cucina</text>
  <text x="815" y="650" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#575757">basi cucina</text>

  <rect x="505" y="220" width="190" height="390" fill="#f6f3ed" stroke="#111" stroke-width="3" stroke-dasharray="9 9"/>
  <text x="535" y="648" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#111">passaggio</text>

  <rect x="480" y="330" width="215" height="118" fill="#ffffff" stroke="#111" stroke-width="4"/>
  <rect x="500" y="350" width="175" height="78" fill="#e8e4dd"/>
  <text x="500" y="316" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#111">lavastoviglie aperta</text>

  <rect x="505" y="448" width="190" height="162" fill="url(#hatch)" stroke="#b82018" stroke-width="4"/>
  <text x="742" y="372" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#b82018">area critica</text>
  <path d="M740 388 C700 420 680 468 660 510" fill="none" stroke="#b82018" stroke-width="5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b82018"/>
    </marker>
  </defs>

  <line x1="505" y1="180" x2="695" y2="180" stroke="#111" stroke-width="4"/>
  <line x1="505" y1="170" x2="505" y2="190" stroke="#111" stroke-width="4"/>
  <line x1="695" y1="170" x2="695" y2="190" stroke="#111" stroke-width="4"/>
  <text x="540" y="166" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#111">90 cm?</text>

  <rect x="500" y="70" width="560" height="94" rx="12" fill="#111" opacity="0.92"/>
  <text x="530" y="108" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#fff">Il controllo non guarda solo il mobile chiuso.</text>
  <text x="530" y="140" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e8e8e8">Guarda aperture, persone, sedute e movimenti reali.</text>
</svg>