<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><rect width="1600" height="1000" fill="#f6f3ed"/><g font-family="Arial,Helvetica,sans-serif"><text x="70" y="90" font-size="58" font-weight="800" fill="#111">LAVASTOVIGLIE APERTA,</text><text x="70" y="145" font-family="Georgia,serif" font-size="46" font-style="italic" fill="#222">il passaggio si blocca</text><g transform="translate(70 210)"><rect width="980" height="690" rx="26" fill="#fffdf9" stroke="#c9c3b8" stroke-width="3"/><g transform="translate(80 90)"><rect x="0" y="0" width="820" height="500" fill="#faf7f1" stroke="#252525" stroke-width="10"/><rect x="70" y="80" width="680" height="100" fill="#e8e2d9" stroke="#252525" stroke-width="5"/><rect x="300" y="180" width="180" height="210" fill="#fff" stroke="#252525" stroke-width="5"/><path d="M300 390L470 500H620L480 390Z" fill="#ddd3c6" stroke="#252525" stroke-width="5"/><path d="M110 445H275M625 445H760" stroke="#b82018" stroke-width="8" stroke-dasharray="16 12"/><text x="410" y="465" text-anchor="middle" font-size="23" font-weight="800" fill="#b82018">SPORTELLO APERTO</text><text x="410" y="535" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-style="italic" fill="#333">il corridoio utile si riduce</text></g></g><g transform="translate(1090 245)"><text font-size="34" font-weight="800">SISTEMA <tspan fill="#b82018">90G</tspan></text><rect y="80" width="440" height="220" rx="22" fill="#fffdf9" stroke="#c9c3b8" stroke-width="3"/><text x="28" y="132" font-size="18" font-weight="800" fill="#b82018">IL RISCHIO NASCOSTO</text><text x="28" y="188" font-size="26" fill="#222"><tspan x="28">Il passaggio sembra sufficiente</tspan><tspan x="28" dy="36">finché lo sportello non si apre.</tspan></text><rect y="335" width="440" height="200" rx="22" fill="#ebe5db" stroke="#c9c3b8" stroke-width="3"/><text x="28" y="388" font-size="18" font-weight="800">DA VERIFICARE PRIMA</text><text x="28" y="445" font-size="23" fill="#222"><tspan x="28">Apertura, persona davanti</tspan><tspan x="28" dy="34">e percorso contemporaneo.</tspan></text></g><text x="70" y="962" font-size="18" fill="#5d5a55">Una criticità visibile prima dell’ordine resta ancora modificabile.</text><text x="1530" y="962" text-anchor="end" font-size="16" fill="#77716a">sistema90g.it</text></g></svg>