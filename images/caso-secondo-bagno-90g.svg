<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><rect width="1600" height="1000" fill="#f6f3ed"/><g font-family="Arial,Helvetica,sans-serif"><text x="70" y="90" font-size="58" font-weight="800" fill="#111">SECONDO BAGNO,</text><text x="70" y="145" font-family="Georgia,serif" font-size="46" font-style="italic" fill="#222">spazio guadagnato o problemi spostati?</text><g transform="translate(70 210)"><rect width="980" height="690" rx="26" fill="#fffdf9" stroke="#c9c3b8" stroke-width="3"/><g transform="translate(80 80)"><rect width="820" height="520" fill="#faf7f1" stroke="#252525" stroke-width="10"/><path d="M0 260H820M390 0V520" stroke="#252525" stroke-width="9"/><rect x="430" y="55" width="250" height="150" fill="#e8e2d9" stroke="#b82018" stroke-width="5" stroke-dasharray="12 10"/><ellipse cx="500" cy="130" rx="34" ry="22" fill="#fff" stroke="#252525" stroke-width="4"/><rect x="575" y="95" width="55" height="70" rx="10" fill="#fff" stroke="#252525" stroke-width="4"/><path d="M390 170H425" stroke="#faf7f1" stroke-width="22"/><path d="M425 170A70 70 0 0 1 495 240" fill="none" stroke="#77716a" stroke-width="4"/><path d="M520 205C520 270 470 300 410 310" fill="none" stroke="#b82018" stroke-width="8" stroke-dasharray="16 12"/><text x="555" y="240" text-anchor="middle" font-size="22" font-weight="800" fill="#b82018">NUOVO BAGNO</text><text x="190" y="135" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-style="italic">Camera</text><text x="190" y="400" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-style="italic">Zona giorno</text><text x="610" y="400" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-style="italic">Disimpegno</text></g></g><g transform="translate(1090 245)"><text font-size="34" font-weight="800">SISTEMA <tspan fill="#b82018">90G</tspan></text><rect y="80" width="440" height="220" rx="22" fill="#fffdf9" stroke="#c9c3b8" stroke-width="3"/><text x="28" y="132" font-size="18" font-weight="800" fill="#b82018">IL RISCHIO NASCOSTO</text><text x="28" y="188" font-size="26" fill="#222"><tspan x="28">Il nuovo bagno può togliere</tspan><tspan x="28" dy="36">qualità agli spazi vicini.</tspan></text><rect y="335" width="440" height="200" rx="22" fill="#ebe5db" stroke="#c9c3b8" stroke-width="3"/><text x="28" y="388" font-size="18" font-weight="800">DA VERIFICARE PRIMA</text><text x="28" y="445" font-size="23" fill="#222"><tspan x="28">Accessi, impianti, aerazione</tspan><tspan x="28" dy="34">e spazio residuo.</tspan></text></g><text x="70" y="962" font-size="18" fill="#5d5a55">Ricavare una funzione in più può creare un compromesso altrove.</text><text x="1530" y="962" text-anchor="end" font-size="16" fill="#77716a">sistema90g.it</text></g></svg>