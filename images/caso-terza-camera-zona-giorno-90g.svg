<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ricavare una terza camera senza compromettere la zona giorno</title>
  <desc id="desc">Schema concettuale di una planimetria con soggiorno cucina ampio, nuova camera ipotetica e attenzione alle aperture e alla posizione della cucina.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d8d3ca" stroke-width="1" opacity=".38"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1c2528" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b82018"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#f6f3ed"/><rect width="1600" height="1000" fill="url(#grid)"/>
  <g transform="translate(70,52)"><text x="0" y="52" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800" fill="#111">LA TERZA CAMERA ENTRA,</text><text x="0" y="105" font-family="Georgia,serif" font-size="49" font-style="italic" fill="#222">ma cosa resta alla zona giorno?</text><text x="0" y="146" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5d5a55">La superficie sembra sufficiente. Aperture, cucina e forma residua decidono se la casa continua a funzionare.</text></g>
  <g transform="translate(70,230)" filter="url(#shadow)"><rect x="0" y="0" width="930" height="680" rx="24" fill="#fffdf9" stroke="#c9c3b8" stroke-width="2"/><text x="32" y="44" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#7a756d">SCHEMA CONCETTUALE — NON È UN PROGETTO ESECUTIVO</text><g transform="translate(48,74)"><rect x="0" y="0" width="830" height="550" fill="#faf7f1" stroke="#252525" stroke-width="12"/><path d="M0 178H830M260 178V550M520 178V550" fill="none" stroke="#252525" stroke-width="10"/><path d="M0 360H260M520 360H830" fill="none" stroke="#252525" stroke-width="10"/><path d="M260 300H520" fill="none" stroke="#252525" stroke-width="10"/><path d="M95 0V12M370 0V12M690 0V12M830 270H818M120 550V538M690 550V538" stroke="#faf7f1" stroke-width="18"/><rect x="520" y="178" width="310" height="182" fill="#b82018" opacity=".10"/><path d="M520 178V360" stroke="#b82018" stroke-width="7" stroke-dasharray="16 12"/><g font-family="Georgia,serif" font-style="italic" fill="#383632" text-anchor="middle"><text x="130" y="92" font-size="30">Camera</text><text x="390" y="92" font-size="28">Bagno</text><text x="675" y="92" font-size="30">Camera</text><text x="130" y="460" font-size="31">Ingresso</text><text x="390" y="435" font-size="30">Cucina</text><text x="675" y="455" font-size="34">Soggiorno</text></g><text x="675" y="248" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#b82018">IPOTESI TERZA CAMERA</text><text x="675" y="282" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6e2a25">da verificare con aperture e misure reali</text><text x="675" y="322" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="800" fill="#b82018">?</text><path d="M650 360C610 400 585 445 566 500" fill="none" stroke="#b82018" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="550" y="526" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#b82018">Cosa resta davvero utilizzabile?</text></g></g>
  <g transform="translate(1050,230)"><text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" fill="#111">SISTEMA <tspan fill="#b82018">90G</tspan></text><text x="0" y="31" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="2" fill="#4f4b46">PROBLEMI INVISIBILI, PRIMA</text><g transform="translate(0,78)"><rect width="480" height="205" rx="22" fill="#fffdf9" stroke="#c9c3b8" stroke-width="2"/><text x="28" y="46" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="1.5" fill="#b82018">IL RISCHIO NASCOSTO</text><path d="M28 61H220" stroke="#b82018" stroke-width="4"/><text x="28" y="101" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#222"><tspan x="28" dy="0">La nuova stanza può usare</tspan><tspan x="28" dy="34">una delle aperture e cambiare</tspan><tspan x="28" dy="34" font-weight="700">la forma del soggiorno-cucina.</tspan></text></g><g transform="translate(0,310)"><rect width="480" height="185" rx="22" fill="#ebe5db" stroke="#c9c3b8" stroke-width="2"/><text x="28" y="46" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="1.5" fill="#111">DATO DECISIVO</text><text x="28" y="87" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#222"><tspan x="28" dy="0">La cucina deve restare dov’è</tspan><tspan x="28" dy="32">oppure può essere ripensata?</tspan><tspan x="28" dy="32" font-weight="700">La risposta cambia tutto.</tspan></text></g><g transform="translate(0,522)"><rect width="480" height="178" rx="22" fill="#fffdf9" stroke="#c9c3b8" stroke-width="2"/><text x="28" y="46" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="1.5" fill="#111">DA VERIFICARE PRIMA</text><text x="28" y="88" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#222"><tspan x="28" dy="0">Aperture, impianti e forma</tspan><tspan x="28" dy="32">residua della zona giorno,</tspan><tspan x="28" dy="32" font-weight="700" fill="#b82018">prima di tracciare le pareti.</tspan></text></g></g>
  <text x="70" y="962" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5d5a55">Aggiungere una stanza non basta: anche gli ambienti che restano devono continuare a funzionare.</text><text x="1530" y="962" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#77716a">sistema90g.it</text>
</svg>