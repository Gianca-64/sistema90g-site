<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><rect width="1600" height="1000" fill="#f6f3ed"/><g font-family="Arial,Helvetica,sans-serif"><text x="70" y="90" font-size="58" font-weight="800" fill="#111">SCONTO ALTO,</text><text x="70" y="145" font-family="Georgia,serif" font-size="46" font-style="italic" fill="#222">valore poco leggibile</text><g transform="translate(70 210)"><rect width="980" height="690" rx="26" fill="#fffdf9" stroke="#c9c3b8" stroke-width="3"/><g transform="translate(95 75)"><rect width="760" height="540" rx="12" fill="#fff" stroke="#252525" stroke-width="5"/><text x="45" y="60" font-size="24" font-weight="800">PREVENTIVO CUCINA</text><path d="M45 90H715" stroke="#c9c3b8" stroke-width="3"/><g font-size="22" fill="#333"><text x="45" y="145">Composizione</text><text x="610" y="145">€ 12.400</text><text x="45" y="195">Elettrodomestici</text><text x="610" y="195">inclusi</text><text x="45" y="245">Top</text><text x="610" y="245">da definire</text><text x="45" y="295">Montaggio</text><text x="610" y="295">?</text><text x="45" y="345">Trasporto</text><text x="610" y="345">?</text></g><rect x="410" y="390" width="305" height="105" rx="14" fill="#ebe5db" stroke="#b82018" stroke-width="4"/><text x="562" y="430" text-anchor="middle" font-size="18" font-weight="800" fill="#b82018">SCONTO 40%</text><text x="562" y="468" text-anchor="middle" font-size="24" font-weight="800">TOTALE € 9.900</text></g></g><g transform="translate(1090 245)"><text font-size="34" font-weight="800">SISTEMA <tspan fill="#b82018">90G</tspan></text><rect y="80" width="440" height="220" rx="22" fill="#fffdf9" stroke="#c9c3b8" stroke-width="3"/><text x="28" y="132" font-size="18" font-weight="800" fill="#b82018">IL RISCHIO NASCOSTO</text><text x="28" y="188" font-size="26" fill="#222"><tspan x="28">Il totale è chiaro,</tspan><tspan x="28" dy="36">ma alcune voci no.</tspan></text><rect y="335" width="440" height="200" rx="22" fill="#ebe5db" stroke="#c9c3b8" stroke-width="3"/><text x="28" y="388" font-size="18" font-weight="800">DA VERIFICARE PRIMA</text><text x="28" y="445" font-size="23" fill="#222"><tspan x="28">Materiali, codici, accessori</tspan><tspan x="28" dy="34">e lavorazioni comprese.</tspan></text></g><text x="70" y="962" font-size="18" fill="#5d5a55">Il prezzo conta solo se è chiaro cosa viene realmente acquistato.</text><text x="1530" y="962" text-anchor="end" font-size="16" fill="#77716a">sistema90g.it</text></g></svg>