<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Illuminazione funzionale della cucina</title>
  <desc id="desc">Vista cucina con sovrapposizione illustrativa che distingue luce generale e luce operativa sul piano di lavoro, senza quote o indicazioni impiantistiche.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1718" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#0a1718" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0a1718" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="ceilingGlow" cx="50%" cy="8%" r="72%">
      <stop offset="0" stop-color="#fff7d4" stop-opacity="0.78"/>
      <stop offset="0.36" stop-color="#ffe9a5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffe9a5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="taskGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c7" stop-opacity="0.52"/>
      <stop offset="0.52" stop-color="#ffe597" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffe597" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="soft2" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <image href="hero-cucina-90g-2026.jpg" x="0" y="0" width="1536" height="1024" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1536" height="1024" fill="url(#shade)"/>
  <g style="mix-blend-mode:screen">
    <ellipse cx="360" cy="180" rx="300" ry="350" fill="url(#ceilingGlow)" filter="url(#soft)"/>
    <ellipse cx="768" cy="155" rx="330" ry="380" fill="url(#ceilingGlow)" filter="url(#soft)"/>
    <ellipse cx="1180" cy="180" rx="300" ry="350" fill="url(#ceilingGlow)" filter="url(#soft)"/>
    <path d="M170 500 C470 455 1060 455 1366 505 L1320 760 C1040 710 500 710 215 760 Z" fill="url(#taskGlow)" filter="url(#soft2)"/>
  </g>
  <g fill="none" stroke="#fff7cf" stroke-linecap="round" opacity="0.74">
    <path d="M300 92 L300 130" stroke-width="8"/>
    <path d="M768 82 L768 126" stroke-width="8"/>
    <path d="M1236 92 L1236 130" stroke-width="8"/>
    <path d="M255 548 C560 510 980 510 1285 548" stroke-width="6" opacity="0.55"/>
  </g>
  <g fill="#fff5c7" opacity="0.94">
    <circle cx="300" cy="143" r="12"/>
    <circle cx="768" cy="139" r="12"/>
    <circle cx="1236" cy="143" r="12"/>
  </g>
</svg>
