<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><rect width="1600" height="1000" fill="#f6f3ed"/><g font-family="Arial,Helvetica,sans-serif"><text x="70" y="90" font-size="58" font-weight="800" fill="#111">TV E DIVANO TROVANO POSTO,</text><text x="70" y="145" font-family="Georgia,serif" font-size="46" font-style="italic" fill="#222">ma il passaggio finisce nel mezzo</text><g transform="translate(70 210)"><rect width="980" height="690" rx="26" fill="#fffdf9" stroke="#c9c3b8" stroke-width="3"/><g transform="translate(80 80)"><rect width="820" height="520" fill="#faf7f1" stroke="#252525" stroke-width="10"/><rect x="80" y="90" width="250" height="110" rx="15" fill="#e8e2d9" stroke="#252525" stroke-width="5"/><rect x="555" y="90" width="160" height="18" fill="#252525"/><rect x="545" y="115" width="180" height="110" fill="#eef1ef" stroke="#252525" stroke-width="5"/><rect x="315" y="300" width="190" height="95" rx="12" fill="#ddd3c6" stroke="#252525" stroke-width="5"/><path d="M30 450C180 400 280 390 400 390C530 390 635 410 790 465" fill="none" stroke="#b82018" stroke-width="9" stroke-dasharray="16 12"/><text x="410" y="470" text-anchor="middle" font-size="22" font-weight="800" fill="#b82018">PERCORSO QUOTIDIANO</text><text x="205" y="245" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-style="italic">Divano</text><text x="635" y="255" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-style="italic">TV</text><text x="410" y="335" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-style="italic">Tavolo</text></g></g><g transform="translate(1090 245)"><text font-size="34" font-weight="800">SISTEMA <tspan fill="#b82018">90G</tspan></text><rect y="80" width="440" height="220" rx="22" fill="#fffdf9" stroke="#c9c3b8" stroke-width="3"/><text x="28" y="132" font-size="18" font-weight="800" fill="#b82018">IL RISCHIO NASCOSTO</text><text x="28" y="188" font-size="26" fill="#222"><tspan x="28">La disposizione sembra risolta,</tspan><tspan x="28" dy="36">ma il percorso attraversa il living.</tspan></text><rect y="335" width="440" height="200" rx="22" fill="#ebe5db" stroke="#c9c3b8" stroke-width="3"/><text x="28" y="388" font-size="18" font-weight="800">DA VERIFICARE PRIMA</text><text x="28" y="445" font-size="23" fill="#222"><tspan x="28">Vista TV, porte, luce</tspan><tspan x="28" dy="34">e passaggi contemporanei.</tspan></text></g><text x="70" y="962" font-size="18" fill="#5d5a55">Un arredo può entrare e comunque non funzionare bene nell’uso quotidiano.</text><text x="1530" y="962" text-anchor="end" font-size="16" fill="#77716a">sistema90g.it</text></g></svg>