<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d9d5ce" opacity=".4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b82018"/></marker></defs><rect width="1600" height="1000" fill="#f6f3ed"/><rect width="1600" height="1000" fill="url(#g)"/><text x="70" y="90" font-family="Arial" font-size="58" font-weight="800" fill="#111">L’ISOLA ENTRA,</text><text x="70" y="145" font-family="Georgia" font-size="46" font-style="italic" fill="#222">ma il passaggio può sparire</text><g transform="translate(70 210)"><rect width="980" height="690" rx="26" fill="#fffdf9" stroke="#c9c3b8" stroke-width="3"/><g transform="translate(75 75)"><rect width="830" height="540" fill="#faf7f1" stroke="#252525" stroke-width="10"/><rect x="45" y="45" width="740" height="95" fill="#e8e2d9" stroke="#252525" stroke-width="5"/><rect x="245" y="225" width="340" height="125" rx="12" fill="#ddd3c6" stroke="#252525" stroke-width="5"/><circle cx="285" cy="395" r="25" fill="#c9c3b8"/><circle cx="415" cy="395" r="25" fill="#c9c3b8"/><circle cx="545" cy="395" r="25" fill="#c9c3b8"/><path d="M110 285H225M605 285H720" stroke="#b82018" stroke-width="8" marker-end="url(#a)"/><text x="415" y="300" text-anchor="middle" font-family="Georgia" font-size="36" font-style="italic">Isola</text><text x="415" y="470" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#b82018">SEDUTE + APERTURE + PASSAGGIO</text></g></g><g transform="translate(1090 240)"><text font-family="Arial" font-size="34" font-weight="800" fill="#111">SISTEMA <tspan fill="#b82018">90G</tspan></text><rect y="80" width="440" height="220" rx="22" fill="#fffdf9" stroke="#c9c3b8" stroke-width="3"/><text x="28" y="130" font-family="Arial" font-size="18" font-weight="800" fill="#b82018">IL RISCHIO NASCOSTO</text><text x="28" y="182" font-family="Arial" font-size="26" fill="#222"><tspan x="28" dy="0">Sedute, ante e persone</tspan><tspan x="28" dy="36">usano la stessa fascia.</tspan></text><rect y="335" width="440" height="200" rx="22" fill="#ebe5db" stroke="#c9c3b8" stroke-width="3"/><text x="28" y="385" font-family="Arial" font-size="18" font-weight="800" fill="#111">DA VERIFICARE PRIMA</text><text x="28" y="440" font-family="Arial" font-size="23" fill="#222"><tspan x="28" dy="0">Ingombro delle sedie,</tspan><tspan x="28" dy="34">aperture e percorsi reali.</tspan></text></g><text x="70" y="962" font-family="Arial" font-size="18" fill="#5d5a55">Una criticità visibile prima dell’ordine resta ancora una decisione modificabile.</text><text x="1530" y="962" text-anchor="end" font-family="Arial" font-size="16" fill="#77716a">sistema90g.it</text></svg>