          markerHeight="12"
          refX="9"
          refY="6"
          orient="auto">
    <path d="M0,0 L10,6 L0,12 z" fill="#2d70b8"/>
  </marker>

  <marker id="redArrow"
          markerWidth="12"
          markerHeight="12"
          refX="9"
          refY="6"
          orient="auto">
    <path d="M0,0 L10,6 L0,12 z" fill="#c9483f"/>
  </marker>

  <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#f5f1e9"/>
    <stop offset="1" stop-color="#e7e1d7"/>
  </linearGradient>
</defs>

