<svg xmlns="http://www.w3.org/2000/svg"
     width="1536"
     height="1024"
     viewBox="0 0 1536 1024"
     role="img"
     aria-labelledby="title desc">

<title id="title">Penisola cucina con sedute, apertura e passaggio</title>
<desc id="desc">Tavola tecnica editoriale con penisola collegata alla cucina, tre sgabelli, uno arretrato, un cassetto aperto e corridoi di passaggio evidenziati.</desc>

<defs>
