<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Divisione di un appartamento di 180 metri quadrati in due unità</title><desc id="desc">Schizzo architettonico con due appartamenti, accessi indipendenti e disimpegno centrale da verificare.</desc><rect width="1600" height="1000" fill="#f8f6f1"/><g opacity=".28" fill="none" stroke="#b9b3a9" stroke-width="2"><path d="M70 160h1460M70 840h1460"/><path d="M170 95v810M1430 95v810"/></g><text x="90" y="110" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="38" letter-spacing="2" fill="#252927">DIVIDERE 180 MQ IN DUE CASE</text><text x="92" y="150" font-family="Georgia,serif" font-style="italic" font-size="24" fill="#58605b">la superficie non basta: prima vengono accessi e percorsi</text><g transform="translate(260 205)"><path d="M120 90H520L650 30l240 170 250 20 180 200-100 270H760L650 610H120Z" fill="#fff" stroke="#343a36" stroke-width="8" stroke-linejoin="round"/><path d="M120 90H520L650 30l155 110-130 190-95 75H120Z" fill="#dfe7e5" opacity=".92"/><path d="M805 140l85 60 250 20 180 200-100 270H760L650 610l35-205 115-75 75-110Z" fill="#e7dfd2" opacity=".92"/><path d="M580 405h225v205H650l-70-55Z" fill="#f5f2eb" stroke="#68716c" stroke-width="5"/><path d="M120 90H520L650 30l240 170 250 20 180 200-100 270H760L650 610H120Z" fill="none" stroke="#343a36" stroke-width="8" stroke-linejoin="round"/><path d="M520 90v315M650 30v300M805 140v190M580 405H120M580 555H120M805 330l335-110M805 330l415 360M650 610l110 80" fill="none" stroke="#69716d" stroke-width="4"/><path d="M270 90v315M395 405v205M950 180l-95 155M1020 365l230 55M1030 520l190 170" fill="none" stroke="#8b938f" stroke-width="3"/><g fill="none" stroke="#252927" stroke-width="4"><path d="M120 470h-85"/><path d="M35 470q55 0 55 55"/><path d="M740 690v92"/><path d="M740 782q0-58 58-58"/></g><g fill="#b56d4d"><circle cx="90" cy="525" r="12"/><circle cx="798" cy="724" r="12"/></g><g fill="none" stroke="#b56d4d" stroke-width="6" stroke-linecap="round"><path d="M65 525h115"/><path d="M798 724h120"/></g><g fill="none" stroke="#2f5f52" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 14"><path d="M180 525h250q90 0 150-70"/><path d="M918 724H810q-45 0-70-58"/></g><text x="210" y="290" font-family="Georgia,serif" font-style="italic" font-size="30" fill="#2f5f52">unità più piccola</text><text x="930" y="470" font-family="Georgia,serif" font-style="italic" font-size="30" fill="#7a5d45">unità principale</text><text x="594" y="500" font-family="Georgia,serif" font-style="italic" font-size="24" fill="#414744">spazio filtro</text></g><g fill="none" stroke="#333936" stroke-width="3"><path d="M195 530c-75 10-95 60-90 125"/><path d="M105 655l-12-20m12 20 18-13"/><path d="M1320 360c105 5 135 55 125 120"/><path d="M1445 480l-14-21m14 21 20-10"/><path d="M1190 790c65 50 65 95 30 130"/><path d="M1220 920l-4-24m4 24 23-3"/></g><text x="78" y="695" font-family="Georgia,serif" font-style="italic" font-size="25" fill="#343a36">DUE INGRESSI DAVVERO</text><text x="78" y="727" font-family="Georgia,serif" font-style="italic" font-size="25" fill="#343a36">INDIPENDENTI?</text><text x="1220" y="315" font-family="Georgia,serif" font-style="italic" font-size="25" fill="#343a36">IL CORRIDOIO NON È</text><text x="1220" y="347" font-family="Georgia,serif" font-style="italic" font-size="25" fill="#343a36">SEMPRE SPAZIO PERSO</text><text x="935" y="870" font-family="Georgia,serif" font-style="italic" font-size="24" fill="#343a36">PRIMA DELL'ACQUISTO È UNA VERIFICA.</text><text x="935" y="902" font-family="Georgia,serif" font-style="italic" font-size="24" fill="#343a36">DOPO PUÒ DIVENTARE UNA MODIFICA.</text><g stroke="#555d58" stroke-width="2" fill="none"><path d="M360 815h500"/><path d="M360 800v30M860 800v30"/></g><text x="565" y="855" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#555d58">PERCORSI DA VERIFICARE</text></svg>