<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Tiranti e cavi a vista da mantenere ispezionabili</title>
  <desc id="desc">Illustrazione tecnica in stile Sistema 90G con soffitto, tirante metallico, cavo elettrico e pannello di ispezione.</desc>
  <rect width="1200" height="800" fill="#f3efe8"/>
  <rect x="0" y="0" width="1200" height="120" fill="#ddd4c8"/>
  <rect x="0" y="600" width="1200" height="200" fill="#d9c7b2"/>
  <line x1="120" y1="145" x2="1080" y2="145" stroke="#262626" stroke-width="18" stroke-linecap="round"/>
  <line x1="170" y1="190" x2="1030" y2="190" stroke="#6f6a64" stroke-width="8" stroke-linecap="round"/>
  <circle cx="170" cy="190" r="16" fill="#262626"/>
  <circle cx="1030" cy="190" r="16" fill="#262626"/>
  <rect x="785" y="250" width="250" height="170" rx="8" fill="#ffffff" stroke="#262626" stroke-width="6"/>
  <rect x="820" y="290" width="180" height="90" rx="4" fill="#eee7de" stroke="#8a8178" stroke-width="4"/>
  <path d="M170 190 C320 260 420 250 560 205 S820 170 1030 190" fill="none" stroke="#ad7e4a" stroke-width="10" stroke-linecap="round"/>
  <line x1="560" y1="205" x2="560" y2="520" stroke="#ad7e4a" stroke-width="4" stroke-dasharray="10 10"/>
  <line x1="910" y1="420" x2="910" y2="520" stroke="#262626" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="90" y="690" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#171717">Tirante strutturale</text>
  <text x="90" y="735" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#555">Elementi da verificare prima di chiudere o rivestire</text>
  <text x="590" y="545" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ad7e4a">cavo a vista</text>
  <text x="820" y="545" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#171717">ispezionabilità</text>
