<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d9d5ce" opacity=".4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b82018"/></marker></defs><rect width="1600" height="1000" fill="#f6f3ed"/><rect width="1600" height="1000" fill="url(#g)"/><text x="70" y="90" font-family="Arial" font-size="58" font-weight="800" fill="#111">INGRESSO DIRETTAMENTE</text><text x="70" y="145" font-family="Georgia" font-size="46" font-style="italic" fill="#222">sul tavolo e living compresso</text><g transform="translate(70 210)"><rect width="980" height="690" rx="26" fill="#fffdf9" stroke="#c9c3b8" stroke-width="3"/><g transform="translate(75 75)"><rect width="830" height="540" fill="#faf7f1" stroke="#252525" stroke-width="10"/><path d="M0 250H110" stroke="#faf7f1" stroke-width="22"/><path d="M0 250A110 110 0 0 1 110 360" fill="none" stroke="#77716a" stroke-width="4"/><rect x="250" y="205" width="270" height="120" rx="10" fill="#e7dfd4" stroke="#252525" stroke-width="5"/><circle cx="275" cy="180" r="18" fill="#c9c3b8"/><circle cx="495" cy="180" r="18" fill="#c9c3b8"/><circle cx="275" cy="350" r="18" fill="#c9c3b8"/><circle cx="495" cy="350" r="18" fill="#c9c3b8"/><rect x="590" y="240" width="170" height="95" rx="8" fill="#f1ece4" stroke="#252525" stroke-width="5"/><path d="M75 250C155 250 195 250 240 260" fill="none" stroke="#b82018" stroke-width="8" stroke-dasharray="16 14" marker-end="url(#a)"/><text x="55" y="220" font-family="Georgia" font-size="30" font-style="italic">Ingresso</text><text x="385" y="275" text-anchor="middle" font-family="Georgia" font-size="34" font-style="italic">Tavolo</text><text x="675" y="210" text-anchor="middle" font-family="Georgia" font-size="30" font-style="italic">Living</text></g></g><g transform="translate(1090 240)"><text font-family="Arial" font-size="34" font-weight="800" fill="#111">SISTEMA <tspan fill="#b82018">90G</tspan></text><rect y="80" width="440" height="220" rx="22" fill="#fffdf9" stroke="#c9c3b8" stroke-width="3"/><text x="28" y="130" font-family="Arial" font-size="18" font-weight="800" fill="#b82018">IL RISCHIO NASCOSTO</text><text x="28" y="182" font-family="Arial" font-size="26" fill="#222"><tspan x="28" dy="0">Il tavolo può diventare</tspan><tspan x="28" dy="36">parte del percorso d’ingresso.</tspan></text><rect y="335" width="440" height="200" rx="22" fill="#ebe5db" stroke="#c9c3b8" stroke-width="3"/><text x="28" y="385" font-family="Arial" font-size="18" font-weight="800" fill="#111">DA VERIFICARE PRIMA</text><text x="28" y="440" font-family="Arial" font-size="23" fill="#222"><tspan x="28" dy="0">Porta, tavolo, passaggi</tspan><tspan x="28" dy="34">e spazio residuo del living.</tspan></text></g><text x="70" y="962" font-family="Arial" font-size="18" fill="#5d5a55">Una criticità visibile prima dell’ordine resta ancora una decisione modificabile.</text><text x="1530" y="962" text-anchor="end" font-family="Arial" font-size="16" fill="#77716a">sistema90g.it</text></svg>