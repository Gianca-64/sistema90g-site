name: Audit immagini sito

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run image-only audit
        run: python tools/audit_site_images.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IMAGE-AUDIT.md
          if git diff --cached --quiet; then
            echo "Audit report unchanged"
            exit 0
          fi
          git commit -m "audit: aggiorna report immagini del sito"
          git push
