name: Build service images

on:
  push:
    branches: [image-update]
    paths:
      - 'tmp-images/*.b64'
      - '.github/workflows/build-service-images.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode images
        run: |
          mkdir -p images
          [ -f tmp-images/controllo-progetto-cucina.b64 ] && base64 -d tmp-images/controllo-progetto-cucina.b64 > images/hero-controllo-progetto-cucina.jpg || true
          [ -f tmp-images/analisi-preventivo-cucina.b64 ] && base64 -d tmp-images/analisi-preventivo-cucina.b64 > images/hero-analisi-preventivo-cucina.jpg || true
          [ -f tmp-images/verifica-planimetria-distribuzione-casa.b64 ] && base64 -d tmp-images/verifica-planimetria-distribuzione-casa.b64 > images/hero-verifica-planimetria-casa.jpg || true
          [ -f tmp-images/scelta-finiture-casa.b64 ] && base64 -d tmp-images/scelta-finiture-casa.b64 > images/hero-scelta-finiture-casa.jpg || true
      - name: Commit generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/*.jpg
          git diff --cached --quiet || git commit -m 'Genera fotografie dedicate per le pagine servizio'
          git push
