name: Generate Sistema 90G visuals

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/generate_site_visuals.py
      - tools/fix_case_visual_references.py
      - .github/workflows/generate-site-visuals.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate visual assets
        run: python tools/generate_site_visuals.py

      - name: Fix case visual references
        run: python tools/fix_case_visual_references.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "site: genera nuova libreria visuale Sistema 90G"
          git push
