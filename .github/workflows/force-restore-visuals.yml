name: Force restore approved visuals

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/force-restore-visuals.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore missing approved asset
        run: cp images/hero-analisi-90g.jpg images/hero-casa90g.jpg

      - name: Restore approved visuals
        run: python tools/restore_approved_visuals.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "site: ripristina immagini approvate coerenti con il riferimento"
          git push
