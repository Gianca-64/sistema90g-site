name: Correggi email e chat residue

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/fix_footer_email_chat.py
      - .github/workflows/fix-footer-email-chat.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Correggi tutte le pagine
        run: python tools/fix_footer_email_chat.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Nessuna correzione necessaria"
            exit 0
          fi
          git commit -m "site: corregge email e rimuove link WhatsApp residui"
          git push
