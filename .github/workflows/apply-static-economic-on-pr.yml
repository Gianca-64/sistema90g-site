name: Apply static economic content on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Run patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/static-economic-content.yml').read_text(encoding='utf-8')
          match = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", source, re.S)
          if not match:
              raise SystemExit('Embedded patch script not found')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in match.group(1).splitlines())
          Path('/tmp/static-economic-patch.py').write_text(code, encoding='utf-8')
          PY
          python3 /tmp/static-economic-patch.py
          rm -f .github/workflows/apply-static-economic-on-pr.yml
      - name: Commit patched pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rende statici i contenuti sul valore economico" || exit 0
          git push origin HEAD:${{ github.head_ref }}
