name: Normalize public chrome

on:
  push:
    branches:
      - integrazione/cucina-professionisti-infomaniak-v1

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: integrazione/cucina-professionisti-infomaniak-v1
          fetch-depth: 0

      - name: Normalize indexed pages
        run: python3 tools/normalize-public-chrome.py

      - name: Commit normalization when needed
        run: |
          if git diff --quiet; then
            echo "No normalization needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "fix(site): normalize navigation and footer on indexed pages"
          git push origin HEAD:integrazione/cucina-professionisti-infomaniak-v1
