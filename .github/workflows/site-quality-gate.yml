name: Site quality gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit sito, cucina e contratti pubblici
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit release generale
        run: |
          if ! python tools/audit_release.py; then
            python tools/diagnose_navigation_variants.py
            exit 1
          fi

      - name: Contratto responsive
        run: python tools/test_responsive_contract.py

      - name: Audit navigazione e collegamenti
        run: python tools/audit_section_d_navigation.py .

      - name: Test prezzi e contratto portale
        run: node tools/test_guided_pricing.js

      - name: Contratto sezione D
        run: node tools/test_section_d_contract.js

      - name: Audit focalizzazione cucina
        run: python tools/audit-kitchen-focus.py

      - name: Audit navigazione pubblica cucina
        run: python tools/audit-public-navigation.py

      - name: Sintassi JavaScript percorso commerciale
        run: node --check role-case-path.js

      - name: Sintassi JavaScript navigazione
        run: node --check navigation-conversion.js
