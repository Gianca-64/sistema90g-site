name: Site quality gate

on:
  workflow_dispatch:
  push:
    branches:
      - strategy/free-entry-organic-20260823
    paths-ignore:
      - .quality-gate-status.txt

permissions:
  contents: write

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit sito e contratti pubblici
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit release
        id: release
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python tools/audit_release.py 2>&1 | tee audit-release.log
          status=${PIPESTATUS[0]}
          echo "$status" > audit-release.status
          exit "$status"

      - name: Contratto responsive
        id: responsive
        continue-on-error: true
        run: python tools/test_responsive_contract.py

      - name: Audit navigazione e collegamenti
        id: navigation
        continue-on-error: true
        run: python tools/audit_section_d_navigation.py .

      - name: Audit SEO guide cucina
        id: seo
        continue-on-error: true
        run: python tools/check_guide_seo.py

      - name: Test prezzi e contratto portale
        id: pricing
        continue-on-error: true
        run: node tools/test_guided_pricing.js

      - name: Contratto Free Entry
        id: free_entry
        continue-on-error: true
        run: node tools/test_section_d_contract.js

      - name: Build Cloudflare Pages
        id: build
        continue-on-error: true
        run: bash tools/build_cloudflare.sh

      - name: Verifica confine output Cloudflare
        id: boundary
        continue-on-error: true
        run: |
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/_redirects
          test ! -e dist/tools
          test ! -e dist/.github
          test ! -e dist/.htaccess
          test ! -e dist/CNAME
          test ! -e dist/role-case-path.js
          test ! -e dist/role-case-path.css
          ! find dist -maxdepth 1 -type f -name '*.md' | grep -q .

      - name: Pubblica diagnostica audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-diagnostics
          path: |
            audit-release.log
            audit-release.status
          retention-days: 7

      - name: Registra esito temporaneo sul branch
        if: always()
        shell: bash
        run: |
          cat > .quality-gate-status.txt <<'EOF'
          commit=${{ github.sha }}
          release=${{ steps.release.outcome }}
          responsive=${{ steps.responsive.outcome }}
          navigation=${{ steps.navigation.outcome }}
          seo=${{ steps.seo.outcome }}
          pricing=${{ steps.pricing.outcome }}
          free_entry=${{ steps.free_entry.outcome }}
          build=${{ steps.build.outcome }}
          boundary=${{ steps.boundary.outcome }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .quality-gate-status.txt
          git diff --cached --quiet || git commit -m "ci: record temporary site quality gate status"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Applica esito quality gate
        if: always()
        shell: bash
        run: |
          failed=0
          for outcome in \
            '${{ steps.release.outcome }}' \
            '${{ steps.responsive.outcome }}' \
            '${{ steps.navigation.outcome }}' \
            '${{ steps.seo.outcome }}' \
            '${{ steps.pricing.outcome }}' \
            '${{ steps.free_entry.outcome }}' \
            '${{ steps.build.outcome }}' \
            '${{ steps.boundary.outcome }}'; do
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Site quality gate non superato."
            exit 1
          fi
          echo "SITE QUALITY GATE: PASS"
