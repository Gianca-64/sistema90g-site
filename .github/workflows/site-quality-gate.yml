name: Site quality gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit sito e contratti pubblici
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Normalize duplicated home navigation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'sviluppo/site-quality-gate-20260807'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          raw = path.read_text(encoding='utf-8')
          bad = '<a href="/innovazioni.html">Innovazioni</a><a href="innovazioni.html">Innovazioni</a>'
          good = '<a href="/innovazioni.html">Innovazioni</a>'
          count = raw.count(bad)
          if count == 1:
              path.write_text(raw.replace(bad, good), encoding='utf-8')
              print('Removed duplicate Innovazioni item from home navigation.')
          elif count == 0:
              print('Home navigation already normalized.')
          else:
              raise SystemExit(f'Unexpected duplicate pattern count: {count}')
          PY
          if ! git diff --quiet -- index.html; then
            git config user.name "Gianca-64"
            git config user.email "progettazionecucine@icloud.com"
            git add index.html
            git commit -m "fix: normalize home navigation"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Audit release
        run: |
          if ! python tools/audit_release.py; then
            python tools/diagnose_navigation_variants.py
            exit 1
          fi

      - name: Contratto responsive
        run: python tools/test_responsive_contract.py

      - name: Audit navigazione e collegamenti
        run: python tools/audit_section_d_navigation.py .

      - name: Test prezzi e contratto portale
        run: node tools/test_guided_pricing.js

      - name: Contratto sezione D
        run: node tools/test_section_d_contract.js
