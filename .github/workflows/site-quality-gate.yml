name: Site quality gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit sito e contratti pubblici
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit release diagnostico
        id: release_audit
        shell: bash
        run: |
          set +e
          python tools/audit_release.py 2>&1 | tee audit-release.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python tools/diagnose_navigation_variants.py 2>&1 | tee -a audit-release.log
          fi
          echo "$status" > audit-release.status
          exit 0

      - name: Contratto responsive
        run: python tools/test_responsive_contract.py

      - name: Audit navigazione e collegamenti
        run: python tools/audit_section_d_navigation.py .

      - name: Audit SEO guide cucina
        run: python tools/check_guide_seo.py

      - name: Test prezzi e contratto portale
        run: node tools/test_guided_pricing.js

      - name: Contratto sezione D
        run: node tools/test_section_d_contract.js

      - name: Build Cloudflare Pages
        run: bash tools/build_cloudflare.sh

      - name: Verifica confine output Cloudflare
        run: |
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/_redirects
          test ! -e dist/tools
          test ! -e dist/.github
          test ! -e dist/.htaccess
          test ! -e dist/CNAME
          ! find dist -maxdepth 1 -type f -name '*.md' | grep -q .

      - name: Pubblica diagnostica audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-diagnostics
          path: |
            audit-release.log
            audit-release.status
          retention-days: 7

      - name: Segnala debito storico release
        if: always()
        shell: bash
        run: |
          status="$(cat audit-release.status 2>/dev/null || echo 1)"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Audit release storico non ancora pulito. Consultare l'artifact site-audit-diagnostics."
          else
            echo "Audit release storico pulito."
          fi
