name: One-shot home navigation audit fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/workers-dev-noindex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Remove duplicate Innovazioni link
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          raw = path.read_text('utf-8')
          duplicate = '<a href="/innovazioni.html">Innovazioni</a><a href="innovazioni.html">Innovazioni</a>'
          replacement = '<a href="/innovazioni.html">Innovazioni</a>'
          if duplicate in raw:
              path.write_text(raw.replace(duplicate, replacement, 1), 'utf-8')
              print('Duplicate Innovazioni link removed.')
          else:
              print('Duplicate already absent.')
      - name: Commit exact fix when needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: align home navigation'
          git push origin HEAD:${{ github.head_ref }}
