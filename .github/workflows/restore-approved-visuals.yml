name: Restore approved Sistema 90G visuals

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/restore_approved_visuals.py
      - .github/workflows/restore-approved-visuals.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore approved visuals
        run: python tools/restore_approved_visuals.py

      - name: Commit restored visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "site: rimuove immagini schematiche e ripristina visual approvati"
          git push
