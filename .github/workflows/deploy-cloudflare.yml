name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production dist
        run: bash tools/build_cloudflare.sh

      - name: Validate production package
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          test -f dist/_headers
          test -f dist/cucina-ad-angolo-guida.html
          test -f dist/guide-cucina-sitemap.xml
          ! test -e dist/casi-camere-contenimento.html
          ! test -e dist/casi-distribuzione-casa.html
          ! test -e dist/casi-soggiorno-open-space.html
          ! test -e dist/casi-spazi-servizio.html

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy skipped: configure repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
          fi

      - name: Deploy Worker static assets
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx --yes wrangler@4 deploy

      - name: Verify production endpoints
        if: steps.cloudflare.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://sistema90g.it/ > /tmp/home.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://sistema90g.it/cucina-ad-angolo-guida.html > /tmp/guida.html
          grep -qi "Sistema 90G" /tmp/home.html
          grep -qi "cucina" /tmp/guida.html
          echo "Cloudflare production smoke test passed."

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cloudflare production"
            echo
            echo "- Build cucina-only: completato"
            if [ "${{ steps.cloudflare.outputs.configured }}" = "true" ]; then
              echo "- Deploy Cloudflare: eseguito"
              echo "- Verifica live: eseguita"
            else
              echo "- Deploy Cloudflare: non eseguito"
              echo "- Azione richiesta: aggiungere i secret CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
