name: Fix site images
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-site-images.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable dedicated images
        run: |
          sed -i 's#images/hero-controllo-progetto-cucina.jpg?v=20260623b#images/hero-controllo-progetto-cucina.svg?v=20260623c#g' controllo-progetto-cucina.html privacy-consent.js
          sed -i 's#images/hero-analisi-preventivo-cucina.jpg?v=20260623b#images/hero-analisi-preventivo-cucina.svg?v=20260623c#g' analisi-preventivo-cucina.html privacy-consent.js
          sed -i 's#images/hero-verifica-planimetria-casa.jpg?v=20260623b#images/hero-verifica-planimetria-casa.svg?v=20260623c#g' verifica-planimetria-distribuzione-casa.html privacy-consent.js
          sed -i 's#images/hero-scelta-finiture-casa.jpg?v=20260623b#images/hero-scelta-finiture-casa.svg?v=20260623c#g' scelta-finiture-casa.html privacy-consent.js
          sed -i '0,/images\/caso-lavastoviglie-passaggio.svg/s//images\/errori-reali-lavastoviglie.jpeg?v=20260528/' casi-analizzati.html
      - name: Remove generic image badges
        run: |
          cat >> hero-header-refinement.css <<'EOF'

/* Image repair: remove generic labels and stabilize hero media */
.premium-hero .premium-image::before,
.premium-hero .premium-image::after {
  display: none !important;
  content: none !important;
}
.premium-hero .premium-image img {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
}
EOF
      - name: Commit repair
        run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add -A
          git commit -m 'Ripristina immagini stabili e rimuove etichette generiche'
          git push
