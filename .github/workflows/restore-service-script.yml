name: Restore service script
on:
  push:
    branches: [image-update]
    paths: ['.github/workflows/restore-service-script.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git show origin/main:privacy-consent.js > privacy-consent.js
          sed -i 's/hero-controllo-progetto-cucina.svg?v=20260623a/hero-controllo-progetto-cucina.jpg?v=20260623b/' privacy-consent.js
          sed -i 's/hero-analisi-preventivo-cucina.svg?v=20260623a/hero-analisi-preventivo-cucina.jpg?v=20260623b/' privacy-consent.js
          sed -i 's/hero-verifica-planimetria-casa.svg?v=20260623a/hero-verifica-planimetria-casa.jpg?v=20260623b/' privacy-consent.js
          sed -i 's/hero-scelta-finiture-casa.svg?v=20260623a/hero-scelta-finiture-casa.jpg?v=20260623b/' privacy-consent.js
      - run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add privacy-consent.js
          git commit -m 'Ripristina script e collega fotografie'
          git push
